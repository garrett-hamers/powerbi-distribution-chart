name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # The browser tooling in scripts/browser.mjs drives Chrome over the DevTools
          # Protocol using the global WebSocket, which is only unflagged from Node 22.
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Run full ESLint
        run: npm run eslint
      - name: Run package lint alias
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Package visual
        run: npm run package
      - name: Verify reproducible package
        run: npm run package:reproducible
      # The layout probe renders the packaged bundle in real headless Chromium and
      # measures every element against the visual root's clipped box. It has to run on a
      # real engine: JSDOM has no layout, so every rectangle it reports is zero and a
      # geometry assertion written against it can never fail. The runner resolves its own
      # font files rather than replaying any local measurement - the visual sets no
      # font-family on its SVG text, so it renders in the browser's default serif, which
      # is Times New Roman on Windows and a metric-compatible substitute here.
      - name: Probe layout against the clipped visual root
        run: npm run layout-probe -- --skip-package
      # The probe's scroll walk and sticky rules never fire against this visual, because it
      # has no scroll containers and no sticky elements. That is a real result, and it also
      # leaves those rules unobserved - so they are pointed at DOM built to break them and
      # required to notice. Machinery nobody has watched work is indistinguishable from
      # machinery that cannot work.
      - name: Prove the layout rules are live
        run: npm run layout-selftest
      - name: Prove the layout fixes still fail without their patches
        run: npm run prove-regressions
      - name: Audit dependencies
        run: npm audit
      - name: Audit AppSource submission assets
        run: npm run audit:submission
      - name: Run certification audit
        run: npm run certification-audit
      - name: Record packaged artifact checksum
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          count=$(find dist -maxdepth 1 -name '*.pbiviz' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one PBIVIZ artifact in dist/, found $count." >&2
            exit 1
          fi
          file=$(find dist -maxdepth 1 -name '*.pbiviz')
          bytes=$(stat -c%s "$file")
          sha=$(sha256sum "$file" | cut -d ' ' -f 1)
          echo "$(basename "$file"): $bytes bytes, sha256=$sha"
          {
            echo "### Packaged visual"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| File | \`$(basename "$file")\` |"
            echo "| Bytes | $bytes |"
            echo "| SHA-256 | \`$sha\` |"
            echo "| Commit | \`$COMMIT_SHA\` |"
            echo ""
            echo "Download the \`pbiviz-$COMMIT_SHA\` artifact from this run and upload the"
            echo "\`.pbiviz\` inside it. The SHA-256 above is of the \`.pbiviz\` itself, not of"
            echo "the ZIP that GitHub wraps around downloaded artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload packaged visual
        uses: actions/upload-artifact@v4
        with:
          # On pull_request, github.sha is the synthetic merge commit, which appears
          # nowhere else. Name the artifact after the real commit that was built.
          name: pbiviz-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/*.pbiviz
          retention-days: 90
          if-no-files-found: error
